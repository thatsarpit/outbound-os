name: Feature request
description: Suggest a new channel, lead source, or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the sales problem first, not the solution. What slows you down today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Screenshots or sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do instead today?
  - type: checkboxes
    id: help
    attributes:
      label: Can you help build it?
      options:
        - label: I'd like to open a pull request for this.
