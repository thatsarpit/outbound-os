name: SEO pilot build
on:
  pull_request:
    paths:
      - 'website/**'
      - 'components/**'
      - 'content/**'
      - 'lib/**'
      - 'public/**'
      - 'scripts/**'
      - 'package*.json'
      - 'next.config.*'
      - '.github/workflows/seo-pilot-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seo-pilot-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check:export
      - name: Record the tested commit
        run: echo "Validated source $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
