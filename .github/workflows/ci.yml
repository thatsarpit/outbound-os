name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run check:hygiene

  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Default installation passes preflight without hosted authentication
        run: npm run preflight -- .env.example
      - run: npx prisma generate
      - name: Hermes sales approval gateway
        run: python3 -m unittest discover -s integrations/hermes-sales -v
      - name: Unit tests
        run: npm test
      - name: Integration tests (fresh database through every migration)
        run: npm run test:integration

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Home Screen manifest and actual PNG assets
        run: node ../scripts/verify-web-assets.mjs dist
      - name: Demo build, and sample data only in it
        run: |
          npm run build:demo
          ! grep -rl "Rohan Mehta" dist/assets
          grep -rlq "Rohan Mehta" dist-demo/assets

  mcp:
    name: MCP transport
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-outboundos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp-outboundos/package-lock.json
      - run: npm ci
      - run: npm test

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: The MCP tool list on the site matches the server
        run: node scripts/check-mcp-tools.mjs
      - run: npm run build
      - name: Exported metadata, structured data and internal links
        run: npm run check:export
      - name: Every page is in the sitemap and has a share image
        run: |
          pages=$(find out -name '*.html' ! -name '404.html' ! -name '_not-found.html' | wc -l)
          urls=$(grep -c '<loc>' out/sitemap.xml)
          cards=$(ls out/og/*.png | wc -l)
          echo "pages=$pages sitemap=$urls cards=$cards"
          test "$pages" -eq "$urls"
          test "$cards" -eq "$urls"

  mcp-image:
    name: MCP image boots from private archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build with restrictive release-file permissions
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-context"
          (umask 077; git archive HEAD | tar -x -C "$RUNNER_TEMP/mcp-context")
          docker build -f "$RUNNER_TEMP/mcp-context/mcp-outboundos/Dockerfile" -t outbound-os-mcp:ci "$RUNNER_TEMP/mcp-context"
      - name: Non-root modules, service health and authentication guard
        run: |
          docker run --rm --network none outbound-os-mcp:ci node --input-type=module -e 'await import("/shared/mcpOperations.js")'
          docker run -d --name obos-mcp --network none -e MCP_BEARER_TOKEN=fixture-only -e BACKEND_URL=http://127.0.0.1:3001 outbound-os-mcp:ci
          for i in $(seq 1 30); do
            docker exec obos-mcp curl -sf http://127.0.0.1:3010/healthz && break
            sleep 1
          done
          docker exec obos-mcp curl -sf http://127.0.0.1:3010/healthz
          test "$(docker exec obos-mcp curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3010/mcp)" = 401
      - name: Clean up isolated MCP boot test
        if: always()
        run: docker rm -f obos-mcp || true

  docker:
    name: Docker image boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t outbound-os:ci .
      - name: First boot from an untouched example config
        run: |
          cp .env.example .env
          docker run -d --name obos --env-file .env \
            -e DATABASE_URL=file:/app/data/outboundos.db -p 3001:3001 outbound-os:ci
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/healthz && break
            sleep 2
          done
          curl -sf http://localhost:3001/healthz
          test "$(curl -s http://localhost:3001/api/auth/config)" = '{"provider":"local"}'
          docker logs obos 2>&1 | grep -q "First admin created"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Documented Nginx proxy, forwarded headers and authenticated SSE
        run: node scripts/verify-nginx.mjs
      - name: Logs on failure
        if: failure()
        run: docker logs obos 2>&1 | sed '/First admin created:/s/with generated password .*/with generated password <redacted>/' || true
      - name: Clean up isolated boot test
        if: always()
        run: |
          docker rm -f obos || true
          rm -f .env
