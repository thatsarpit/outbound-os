name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Unit tests
        run: npm test
      - name: Integration tests (fresh database through every migration)
        run: npm run test:integration

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Every page is in the sitemap and has a share image
        run: |
          pages=$(find out -name '*.html' ! -name '404.html' ! -name '_not-found.html' | wc -l)
          urls=$(grep -c '<loc>' out/sitemap.xml)
          cards=$(ls out/og/*.png | wc -l)
          echo "pages=$pages sitemap=$urls cards=$cards"
          test "$pages" -eq "$urls"
          test "$cards" -eq "$urls"

  docker:
    name: Docker image boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t outbound-os:ci .
      - name: First boot from an untouched example config
        run: |
          cp .env.example .env
          docker run -d --name obos --env-file .env \
            -e DATABASE_URL=file:/app/data/outboundos.db -p 3001:3001 outbound-os:ci
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/healthz && break
            sleep 2
          done
          curl -sf http://localhost:3001/healthz
          test "$(curl -s http://localhost:3001/api/auth/config)" = '{"provider":"local"}'
          docker logs obos 2>&1 | grep -q "First admin created"
      - name: Logs on failure
        if: failure()
        run: docker logs obos || true
